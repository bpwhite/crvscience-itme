[package]
name = "itme_evolution_sim"
version = "2.3.0"
edition = "2021"
authors = ["Bryan P. White <https://crvscience.com>"]
repository = "https://github.com/bpwhite/crvscience-itme"
homepage = "https://crvscience.com/apps"
description = "ITME v23.0 Native Rust Simulation: Continuous 4.25 Ga Multi-Epoch Grand Trajectory chaining Homochirality, SGC, RNA-to-DNA Virosphere, LUCA, Symbiogenesis, Multicellularity, Superorganisms, Exosomatic Archives, Formal AI & Gaia-2.0 Homeostasis"
license = "GPL-3.0-or-later"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd", "dep:png"]

[dependencies]
eframe = { version = "0.29", features = ["wgpu"], optional = true, default-features = true }
rfd = { version = "0.15", optional = true }
png = { version = "0.18", optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
